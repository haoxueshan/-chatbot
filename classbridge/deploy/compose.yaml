name: classbridge
x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file: ../.env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://classbridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/classbridge
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    TASK_MODE: celery
    ENVIRONMENT: production
  volumes:
    - files:/data
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: classbridge
      POSTGRES_USER: classbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U classbridge -d classbridge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/api/health]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    <<: *backend
    command: [celery, -A, app.workers.tasks:celery_app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "celery -A app.workers.tasks:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 30s
  beat:
    <<: *backend
    command: [celery, -A, app.workers.tasks:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  files:
